# Conda recipe for NYX.
#
# Build and install locally from a clone of this repository:
#   conda build conda/ -c conda-forge
#   conda install --use-local nyx -c conda-forge
#
# For Bioconda, replace the source block with the tagged release:
#   git_url: https://github.com/Georgakopoulos-Soares-lab/compression
#   git_rev: v{{ version }}
# A git source is required rather than a tarball: OpenZL brings zstd, lz4 and
# xgboost in as git submodules, which release tarballs do not contain.
{% set version = "1.0.0" %}

package:
  name: nyx
  version: {{ version }}

source:
  git_url: ../

build:
  number: 0
  skip: true  # [not linux]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - make
    - cmake >=3.20
    - git
  host:
    - zlib
  run:
    - zlib
    - bash
    - tar
    - gzip

test:
  commands:
    - nyx --version
    - nyx --help
    - printf '>chr1 test\nACGTACGTNNNNacgtACGTACGTACGTACGTACGT\nACGTAC\n>chr2\nGGGGCCCCAAAATTTT\n' > t.fa
    - printf '@r1\nACGTACGTAC\n+\nIIIIIIIIII\n@r2\nTTTTGGGGCC\n+\nJJJJJJJJJJ\n' > t.fastq
    - printf '##fileformat=VCFv4.2\n#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\tFORMAT\tS1\tS2\nchr1\t100\t.\tA\tG\t50\tPASS\tDP=10\tGT\t0|1\t1|1\nchr1\t200\t.\tC\tT\t40\tPASS\tDP=7\tGT\t0|0\t0|1\n' > t.vcf
    - printf 'chr1\t100\t200\tp1\t0\t+\nchr1\t300\t450\tp2\t7\t-\n' > t.bed
    - nyx test t.fa --threads 2
    - nyx test t.fastq --threads 2
    - nyx test t.vcf --threads 2
    - nyx test t.bed --threads 2

about:
  home: https://github.com/Georgakopoulos-Soares-lab/compression
  license: PolyForm-Noncommercial-1.0.0
  license_file: LICENSE.md
  summary: Lossless, format-aware compression for FASTA, FASTQ, VCF and BED files
  description: |
    NYX rewrites each file into homogeneous streams with a reversible,
    format-specific transform and compresses them with pre-trained OpenZL
    graphs. Nothing is trained on the user's data, every round trip is
    byte-exact, and one input file gives one output file.
