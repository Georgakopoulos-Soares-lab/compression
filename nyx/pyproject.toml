[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx"
version = "0.1.0"
description = "CLI wrapper for OpenZL genomic compression pipelines"
requires-python = ">=3.13"
dependencies = ["click>=8.0", "tqdm>=4.60"]

[project.scripts]
nyx = "nyx.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
# Include non-Python files that ship with the package
nyx = ["../schemas/*.sddl", "../scripts/*.sh", "../scripts/*.py", "../tools/*.cpp"]
